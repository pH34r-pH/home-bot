name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and HTTP API tests
        run: python -m unittest discover -s tests -v
      - name: Generated world consistency
        run: python scripts/build_worlds.py --check
      - name: Compile Python modules
        run: python -m compileall -q src scripts sim/webots/controllers
      - name: Check operator JavaScript syntax
        run: node --check src/home_bot/web/app.js
